services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STICKER_PACK_NAME=higorlino.dev bot
      - STICKER_AUTHOR=higorlino.dev
      - STORAGE_PATH=/app/storage
      - SESSIONS_PATH=/app/sessions
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - sessions:/app/sessions
      - storage:/app/storage
      - sqldata:/app/data
    working_dir: /app
    command: >
      sh -c "
        npm install --legacy-peer-deps &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        npx tsx watch src/server.ts
      "
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  node_modules:
  sessions:
  storage:
  redis_data:
  sqldata:
